<meta name="claude:viewport-fit-sides" content="cover">
<title>Progress</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f7f3ed;
    --bg-raised: #fbf8f2;
    --surface: #fffaf3;
    --surface-strong: #ffffff;
    --fg: #1f242c;
    --fg-soft: #596171;
    --muted: #7c8394;
    --line: #dfd4c3;
    --accent: #d95728;
    --accent-strong: #b73f15;
    --good: #1f8f63;
    --warn: #b7770a;
    --bad: #bc3f45;
    --shadow: 0 20px 45px rgba(52, 40, 23, 0.10);
    --radius: 18px;
    --radius-sm: 12px;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171a1f;
      --bg-raised: #1f232b;
      --surface: #242933;
      --surface-strong: #2d3340;
      --fg: #f4efe6;
      --fg-soft: #c5c1b7;
      --muted: #9096a6;
      --line: #3b404b;
      --accent: #ef7a43;
      --accent-strong: #d95a24;
      --shadow: 0 24px 56px rgba(0, 0, 0, 0.34);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #171a1f;
    --bg-raised: #1f232b;
    --surface: #242933;
    --surface-strong: #2d3340;
    --fg: #f4efe6;
    --fg-soft: #c5c1b7;
    --muted: #9096a6;
    --line: #3b404b;
    --accent: #ef7a43;
    --accent-strong: #d95a24;
    --shadow: 0 24px 56px rgba(0, 0, 0, 0.34);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  .taskflow-app {
    min-height: 100%;
    padding-block: 24px;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(130deg, var(--bg) 0%, var(--bg-raised) 100%);
  }

  body { margin: 0; color: var(--fg); font-family: "Instrument Sans", system-ui, sans-serif; background: var(--bg); }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; letter-spacing: -0.02em; }
  button, input, select, textarea { font: inherit; }

  .masthead {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px;
    align-items: end;
    margin-bottom: 24px;
  }
  .masthead h1 { margin: 0 0 6px; font-size: clamp(2rem, 5vw, 3.4rem); line-height: 0.95; }
  .masthead p { margin: 0; color: var(--fg-soft); max-width: 62ch; }
  .badge-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .badge {
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--fg-soft);
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .badge strong { color: var(--fg); }

  .toolbar {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1fr auto;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
  }
  .toolbar input, .toolbar select {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface-strong);
    color: var(--fg);
  }
  .toolbar input:focus, .toolbar select:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

  .progress {
    margin-bottom: 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    height: 12px;
  }
  .progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); }
  .progress-label { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--fg-soft); font-size: 0.9rem; }

  .board-section {
    margin-top: 20px;
    padding: 12px;
    border-radius: var(--radius-sm);
    background-color: color-mix(in srgb, var(--category-background, transparent) 24%, transparent);
  }
  .board-settings { display: flex; justify-content: flex-end; margin-top: 20px; }
  #category-order { padding-inline-start: 1.5rem; margin-block: 0; }
  #category-order li + li { margin-top: .5rem; }
  .category-order-row, .category-color { display: flex; align-items: center; gap: .75rem; }
  .category-order-row { justify-content: space-between; flex-wrap: wrap; }
  .category-color { margin-top: .35rem; flex-wrap: wrap; }
  .category-color input[type="color"] { padding: 2px; height: 2rem; width: 2.5rem; cursor: pointer; }
  .category-order-actions { display: flex; gap: .5rem; }
  .board-section > summary { cursor: pointer; font-weight: 700; }
  .parent-scope:not([hidden]) { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-block: .75rem; }
  .parent-scope-title { overflow-wrap: anywhere; }
  .card-title-button {
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: start;
    text-decoration: underline;
    text-underline-offset: .15em;
  }
  #task-parent-field[hidden] { display: none; }

  .board {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    margin-bottom: 24px;
  }
  .column {
    min-width: 0;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .column-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-raised);
  }
  .column-header h2 { margin: 0; font-size: 1.1rem; }
  .column > .column-header h2 { display: flex; align-items: center; gap: .5rem; }
  .column-header .count {
    min-width: 1.5em;
    padding: .15em .4em;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg-soft);
    font: 600 .75rem system-ui, sans-serif;
    text-align: center;
  }
  .column-body {
    min-height: 180px;
    padding: 14px;
    display: grid;
    gap: 12px;
  }
  .column.drop-target { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }

  .card {
    cursor: grab;
    background: var(--surface-strong);
    border: 1px solid var(--line);
    border-left: 5px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 14px;
    display: grid;
    gap: 10px;
  }
  .card.dragging { opacity: 0.55; }
  .card.drop-before { box-shadow: 0 -4px 0 var(--accent); }
  .card.drop-after { box-shadow: 0 4px 0 var(--accent); }
  .card-header { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
  .card-header h3 { margin: 0; font-size: 1.02rem; line-height: 1.2; }
  .card-notes { margin: 0; color: var(--fg-soft); font-size: 0.9rem; line-height: 1.45; }
  .card-meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag, .due {
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--bg-raised);
    color: var(--fg-soft);
    font-size: 0.75rem;
  }
  .due.overdue { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); font-weight: 600; }
  .card-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .status-select { padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg-raised); color: var(--fg); }

  .priority {
    text-transform: capitalize;
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
  }
  .priority-high { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .priority-medium { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .priority-low { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }

  .empty-state {
    min-height: 120px;
    display: grid;
    place-items: center;
    color: var(--muted);
    text-align: center;
    font-size: 0.9rem;
  }

  .panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .panel article {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
  }
  .panel pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px;
    min-height: 92px;
  }

  button {
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    background: var(--surface-strong);
    color: var(--fg);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.ghost { background: transparent; }
  button.danger { color: var(--bad); }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  dialog {
    border: none;
    border-radius: var(--radius);
    padding: 0;
    width: min(560px, calc(100vw - 32px));
    background: var(--surface-strong);
    color: var(--fg);
    box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(15, 16, 20, 0.5); }
  .dialog-body { padding: 22px; display: grid; gap: 14px; }
  .dialog-body h2 { margin: 0; }
  .dialog-body label { display: grid; gap: 6px; color: var(--fg-soft); font-size: 0.86rem; font-weight: 600; }
  .dialog-body input, .dialog-body textarea, .dialog-body select {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--bg-raised);
    color: var(--fg);
  }
  .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .dialog-actions button { min-width: 96px; }

  .message {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 16px;
    border-radius: 999px;
    background: var(--surface-strong);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
  }
  .message[data-type] { opacity: 1; }
  .message[data-type="error"] { color: var(--bad); }

  @media (max-width: 900px) {
    .taskflow-app { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
    .masthead { grid-template-columns: 1fr; }
    .badge-row { justify-content: flex-start; }
    .toolbar { grid-template-columns: 1fr; }
    .board { grid-template-columns: 1fr; }
    .panel { grid-template-columns: 1fr; }
  }
</style>

<div class="taskflow-app">
  <header class="masthead">
    <div>
      <h1>Progress</h1>
      <p>A shared board for goals and tasks.</p>
      <p id="sync-status" role="status" aria-live="polite">Connecting to shared board…</p>
    </div>
  </header>

  <div class="board-settings">
    <button id="edit-category-order" type="button">Edit categories</button>
  </div>
  <div id="board-sections"></div>
</div>

<template id="kanban-section">
  <details class="board-section">
    <summary></summary>
    <div class="parent-scope" hidden>
      <strong class="parent-scope-title" tabindex="-1"></strong>
      <button type="button"></button>
    </div>
    <div class="badge-row">
      <span class="badge"><strong data-control="total-count">0</strong> total</span>
      <span class="badge"><strong data-control="active-count">0</strong> active</span>
      <span class="badge"><strong data-control="done-count">0</strong> done</span>
    </div>
    <section class="toolbar">
      <input data-control="search" type="search">
      <select data-control="priority-filter" aria-label="Filter by priority">
        <option value="all">All priorities</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <select data-control="sort">
        <option value="manual">Manual order</option>
        <option value="due">Due date</option>
        <option value="priority">Priority</option>
        <option value="created">Newest first</option>
      </select>
      <button data-control="new-task" class="primary" type="button"></button>
    </section>

    <section class="progress-label">
      <span data-control="progress-label"></span>
      <span data-control="progress-text">0% complete</span>
    </section>
    <div class="progress"><span data-control="progress-bar" style="width: 0%"></span></div>

    <section class="board" data-control="board"></section>

    <section class="panel">
      <article>
        <h2>JSON import/export</h2>
        <p>Use this to move lists between browsers or back up data.</p>
        <div class="button-row" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
          <button data-control="export-data" type="button">Export</button>
          <button data-control="import-data" type="button">Import</button>
          <button data-control="clear-done" type="button">Clear done</button>
        </div>
        <p class="hint">Keyboard: <kbd>N</kbd> new item, <kbd>/</kbd> search, <kbd>Esc</kbd> close.</p>
      </article>
      <article>
        <h2>Working rules</h2>
        <ul>
          <li>Drag cards up or down to rank them, or between columns to change status.</li>
          <li>Use priorities to triage risks.</li>
          <li>Keep dependency-heavy work in Backlog until scope is clear.</li>
        </ul>
      </article>
    </section>
  </details>
</template>

<template id="kanban-column">
  <section class="column">
    <header class="column-header">
      <h2><span class="column-title"></span> <span class="count">0</span></h2>
      <button class="ghost" type="button">Add</button>
    </header>
    <div class="column-body"></div>
  </section>
</template>

<div id="message" class="message" role="status" aria-live="polite"></div>

<dialog id="category-dialog" aria-labelledby="category-dialog-title">
  <form id="category-form" class="dialog-body">
    <h2 id="category-dialog-title">Edit categories</h2>
    <p class="hint">Adding or deleting a category updates the shared board immediately. Save changes to keep this browser’s order and colors.</p>
    <div class="category-order-row">
      <input id="new-category-name" aria-label="Category name" placeholder="Category name" maxlength="60">
      <button id="add-category" type="button">Add category</button>
    </div>
    <p id="category-status" role="status" hidden></p>
    <ol id="category-order"></ol>
    <div class="dialog-actions">
      <button id="cancel-category-order" type="button">Cancel</button>
      <button class="primary" type="submit">Save changes</button>
    </div>
  </form>
</dialog>

<dialog id="category-delete-dialog" aria-labelledby="category-delete-title">
  <form id="category-delete-form" class="dialog-body">
    <h2 id="category-delete-title">Delete category?</h2>
    <label>Move its items to
      <select id="category-destination" required></select>
    </label>
    <p id="category-delete-status" role="status" hidden></p>
    <div class="dialog-actions">
      <button id="cancel-category-delete" type="button">Cancel</button>
      <button class="danger" type="submit">Move items and delete</button>
    </div>
  </form>
</dialog>

<dialog id="task-dialog">
  <form id="task-form" class="dialog-body">
    <h2 id="dialog-title">New task</h2>
    <label>Title
      <input id="task-title" required maxlength="120" autocomplete="off">
    </label>
    <label id="task-parent-field" hidden>
      <span id="task-parent-label"></span>
      <select id="task-parent"></select>
    </label>
    <label>Notes
      <textarea id="task-notes" rows="4" maxlength="1000"></textarea>
    </label>
    <label>Tag
      <input id="task-tag" maxlength="32" placeholder="release, api, ui">
    </label>
    <label>Priority
      <select id="task-priority">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
    </label>
    <label>Due date
      <input id="task-due" type="date">
    </label>
    <label>Status
      <select id="task-status">
        <option value="backlog">Backlog</option>
        <option value="doing">Doing</option>
        <option value="done">Done</option>
      </select>
    </label>
    <div class="dialog-actions">
      <button type="button" id="cancel-task">Cancel</button>
      <button class="primary" type="submit">Save</button>
    </div>
  </form>
</dialog>

<dialog id="import-dialog">
  <div class="dialog-body">
    <h2>Import/export JSON</h2>
    <label>JSON
      <textarea id="import-text" rows="10"></textarea>
    </label>
    <div class="dialog-actions">
      <button id="close-import" type="button">Close</button>
      <button id="import-submit" class="primary" type="button">Import</button>
    </div>
  </div>
</dialog>

<dialog id="delete-dialog">
  <div class="dialog-body">
    <h2>Delete task?</h2>
    <p id="delete-name"></p>
    <div class="dialog-actions">
      <button id="cancel-delete" type="button">Cancel</button>
      <button id="delete-confirm" class="danger" type="button">Delete</button>
    </div>
  </div>
</dialog>

<script src="sync.js"></script>
<script type="module" src="app.js"></script>
